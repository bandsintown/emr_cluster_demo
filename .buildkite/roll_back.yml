steps:
  - label: "Rollback: List Recent Tags"
    key: "rb_list_tags"
    command: |
      set -euo pipefail

      # 1. Setup variables
      SERVICE_NAME="DailyArtistMetrics"
      AWS_REGION="us-east-1"
      AWS_ACCOUNT_ID="004095192903"
      ECR_REPOSITORY="emr_cluster"
      REGISTRY_ID="$${AWS_ACCOUNT_ID}"
      ECR_REGISTRY="$${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      # Required by s3-push.yml
      IMAGE_URI="$${AWS_ACCOUNT_ID}.dkr.ecr.$${AWS_REGION}.amazonaws.com/$${ECR_REPOSITORY}"

      echo "--- Authenticating to ECR registry: $${ECR_REGISTRY} ---"
      aws ecr get-login-password --region "$${AWS_REGION}" \
        | docker login --username AWS --password-stdin "$${ECR_REGISTRY}" >/dev/null 2>&1 || true

      # tr '\t' '\n' splits the tab-separated tags into individual lines
      TAGS=$$(aws ecr describe-images \
        --registry-id "$${REGISTRY_ID}" \
        --repository-name "$${ECR_REPOSITORY}" \
        --region "$${AWS_REGION}" \
        --query 'sort_by(imageDetails, &imagePushedAt)[*].imageTags[]' \
        --output text | tr '\t' '\n' | grep "_$${SERVICE_NAME}" | tac | head -n 10)

      if [ -z "$${TAGS}" ]; then
        echo "Error: No tags found matching $${SERVICE_NAME}."
        exit 1
      fi

      echo "--- Recent Tags Found ---"
      echo "$${TAGS}"

      # Now sed will correctly pick the 2nd line
      PREVIOUS_TAG=$(echo "$${TAGS}" | sed -n '2p')

      echo "---"
      echo "Suggested Rollback Tag: $${PREVIOUS_TAG}"

      # Persist for downstream steps
      buildkite-agent meta-data set "ROLLBACK_TAG" "$${PREVIOUS_TAG}"
      buildkite-agent meta-data set "BUILD_TAG" "$${PREVIOUS_TAG}"
      buildkite-agent meta-data set "IMAGE_URI" "$${IMAGE_URI}"
      buildkite-agent meta-data set "AWS_REGION" "$${AWS_REGION}"
      buildkite-agent meta-data set "AWS_ACCOUNT_ID" "$${AWS_ACCOUNT_ID}"
      buildkite-agent meta-data set "SERVICE_NAME" "$${SERVICE_NAME}"

  - label: "Rollback: Push previous tag to S3"
    key: "rb_push_previous_to_s3"
    depends_on: "rb_list_tags"
    command: |
      set -euo pipefail
      echo "Using base image: $$(buildkite-agent meta-data get IMAGE_URI):$$(buildkite-agent meta-data get BUILD_TAG)"
      buildkite-agent pipeline upload .buildkite/s3-push.yml
