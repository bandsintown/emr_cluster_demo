# rollback-pipeline.yml
steps:
  # --- 1. SELECT SERVICE TO ROLL BACK ---
  - label: "⚙️ Select Service to Roll Back"
    key: "get_service_name_rb"
    type: input
    fields:
      - select: "SERVICE_NAME"
        key: "SERVICE_NAME"
        required: true
        options:
          - label: "FanSeo"
            value: "FanSeo"
          - label: "DailyArtistMetrics"
            value: "DailyArtistMetrics"

  # --- 2. FETCH RECENT ECR TAGS ---
  - label: "🔎 Fetch recent ECR tags"
    key: "fetch_tags"
    depends_on: "get_service_name_rb"
    command: |
      set -euo pipefail

      SERVICE_NAME="${SERVICE_NAME}"
      AWS_REGION="us-east-1"
      ECR_REPOSITORY="emr_cluster"

      # Ensure AWS CLI exists
      if ! command -v aws >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache aws-cli >/dev/null
        else
          echo "aws CLI not found on agent" >&2
          exit 1
        fi
      fi

      echo "--- Recent tags for service: ${SERVICE_NAME} ---"
      TAGS=$(python3 .buildkite/list_ecr_tags.py --region "${AWS_REGION}" --repo "${ECR_REPOSITORY}" --service "${SERVICE_NAME}" --limit 30 | tr '\n' ',' | sed 's/,$//')

      if [ -z "${TAGS}" ]; then
        echo "No tags found for service ${SERVICE_NAME}" >&2
        exit 1
      fi

      # Store for the next input step
      buildkite-agent meta-data set "ROLLBACK_TAG_OPTIONS" "${TAGS}"
      buildkite-agent meta-data set "SERVICE_NAME" "${SERVICE_NAME}"

  # --- 3. CHOOSE ROLLBACK TAG ---
  - label: "⏪ Choose Rollback Tag"
    key: "choose_tag"
    depends_on: "fetch_tags"
    type: input
    prompt: "Pick the image tag to roll back to (most recent first)."
    fields:
      - select: "ROLLBACK_TAG"
        key: "ROLLBACK_TAG"
        required: true
        options:
          - label: "${ROLLBACK_TAG_OPTIONS}"
            value: "${ROLLBACK_TAG_OPTIONS}"

  # --- 4. EXECUTE ROLLBACK ---
  - label: "⏪ Execute rollback"
    key: "execute_rollback"
    depends_on: "choose_tag"
    command: |
      set -euo pipefail

      SERVICE_NAME="$$(buildkite-agent meta-data get "SERVICE_NAME")"
      ROLLBACK_TAG="${ROLLBACK_TAG}"

      AWS_ACCOUNT_ID="004095192903"
      AWS_REGION="us-east-1"
      ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      ECR_REPOSITORY="emr_cluster"

      ROLLBACK_IMAGE_URI="${ECR_URI}/${ECR_REPOSITORY}:${ROLLBACK_TAG}"

      echo "Rolling back service ${SERVICE_NAME} to: ${ROLLBACK_IMAGE_URI}"
      echo "TODO: add deployment logic here"
